# Builds the Windows and macOS packages on a version tag (v1.2.3) and attaches the ZIPs to a GitHub Release.
# Run it by hand (Actions > Paketleri derle > Run workflow) to get the ZIPs as build artifacts without a release.
name: Paketleri derle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'  # the build and smoke scripts print Turkish text; Windows runners default to cp1252

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/SlayttanVideoya/SlayttanVideoya.exe
          - os: macos-latest       # Apple Silicon (M1 and newer)
            exe: dist/Slayttan Videoya.app/Contents/MacOS/SlayttanVideoya
          - os: macos-15-intel     # Intel Macs
            exe: dist/Slayttan Videoya.app/Contents/MacOS/SlayttanVideoya
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - run: pip install -r packaging/requirements-build.txt
      - name: Build
        run: python packaging/build.py "${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}"
      - name: Smoke test
        run: python packaging/smoke.py "${{ matrix.exe }}"
      - uses: actions/upload-artifact@v5
        with:
          name: package-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: package-*
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./*.zip --repo "$GITHUB_REPOSITORY" --title "Slayttan Videoya $TAG" \
              --notes "Windows için SlayttanVideoya-windows-x64.zip, Apple Silicon (M1 ve sonrası) Mac için SlayttanVideoya-macos-arm64.zip, Intel Mac için SlayttanVideoya-macos-x64.zip dosyasını indirin. Kurulum adımları: https://github.com/$GITHUB_REPOSITORY#readme"
          fi
